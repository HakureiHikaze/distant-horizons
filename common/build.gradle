plugins {
    id 'dh-loader'
}

// Unit tests need the same Minecraft/renderpearl compile surface as main
configurations {
    testImplementation.extendsFrom(compileOnly)
}

// JUnit for common's standalone unit tests (no Minecraft client required)
dependencies {
    testImplementation("org.junit.jupiter:junit-jupiter:5.8.2")
    testImplementation("org.junit.jupiter:junit-jupiter-engine:5.8.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.8.2")
    testImplementation("org.apache.logging.log4j:log4j-api:${rootProject.log4j_version}")
    testImplementation("org.apache.logging.log4j:log4j-core:${rootProject.log4j_version}")
}

test {
    useJUnitPlatform()
}

// Unit tests need the same Minecraft/renderpearl surface as main
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

// Mojang removed ARM LWJGL natives, which causes CI to fail for 1.12.2. Note: this means we cannot build on ARM CPUs right now.
configurations.configureEach {
    incoming.beforeResolve {
        dependencies.withType(ExternalDependency).each { dep ->
            if (dep.group == 'org.lwjgl') {
                dep.artifacts.removeIf {
                    it.classifier?.contains('arm')
                }
            }
        }
    }
}
