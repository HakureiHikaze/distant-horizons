# 26.3.0 version (26.3-snapshot-7)
# Environment baseline: docs/plan-26.3-fabric-port.md
# Fabric Loader normalizes the game version to 26.3-alpha.7 at runtime
java_version=25
minecraft_version=26.3-snapshot-7
parchment_version=1.21:2024.07.28
compatible_minecraft_versions=["26.3-alpha.7"]
accessWidenerVersion=26_3
builds_for=fabric

# Netty
netty_version=4.2.16.Final

# LWJGL
lwjgl_version=3.4.2

# Fabric loader
fabric_loader_version=0.19.3
fabric_api_version=0.156.3+26.3
    modmenu_version=
    starlight_version_fabric=
    phosphor_version_fabric=
    lithium_version=
    sodium_version=
    iris_version=
    bclib_version=
    immersive_portals_version=
    canvas_version=

    # vertigo - prevents DH from seeing the full chunk, causing holes
    fabric_incompatibility_list={ "vertigo": "*" }
    fabric_recommend_list={}

    # Fabric mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_mod_menu=0
    # 26.3: ModMenu integration class is a non-API stub until stage 5; keep the entrypoint empty
    # so installing ModMenu cannot trigger a ClassCastException.
    fabric_modmenu_entrypoint=
    enable_starlight=0
    enable_phosphor=0
    enable_sodium=0
    enable_lithium=0
    enable_iris=0
    enable_bclib=0
    enable_immersive_portals=0
    enable_canvas=0

# NeoForge loader (not built for 26.3)
forge_version=
neoforge_version=
neoforge_version_range=[*,)

    # NeoForge mod versions
    neo_iris_version=

    # (Neo)Forge mod run
    neo_enable_iris=0
